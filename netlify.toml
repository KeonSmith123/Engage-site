[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Shared helpers live in netlify/lib and are bundled into each function.

[build.environment]
  NODE_VERSION = "22"

# The About page was retired on 12 Oct 2026; old links go to the story on the homepage
[[redirects]]
  from = "/about/*"
  to = "/#story"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#story"
  status = 301

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the CMS out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Keep the dashboard out of search results and out of frames
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
