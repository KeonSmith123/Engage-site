# Decap CMS config
# Login: GitHub backend. Netlify acts as the OAuth provider:
#   1. GitHub > Settings > Developer settings > OAuth Apps > New
#      Homepage URL: https://<site>.netlify.app   Callback URL: https://api.netlify.com/auth/done
#   2. Netlify > Site configuration > Access control > OAuth > Install provider > GitHub (paste ID + secret)
#   3. Editors need a GitHub account with write access to the repo.

backend:
  name: github
  repo: CAPEX-GITHUB-ORG/capex-site   # <- set to the real GitHub org/repo
  branch: main
  # base_url defaults to https://api.netlify.com (Netlify's OAuth service)

# Uncomment to have edits open as pull requests for review instead of going live on save
# publish_mode: editorial_workflow

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

site_url: https://www.capextransport.co.za
logo_url: /assets/img/logo-capex.png

collections:
  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/guides
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences. Shown on cards and in search results." }
      - { label: Read time, name: readTime, widget: string, required: false, hint: "e.g. 5 min read, or PDF, 6 pages" }
      - { label: Order, name: order, widget: number, default: 10, value_type: int }
      - { label: Gated (email to get it), name: gated, widget: boolean, default: false }
      - { label: PDF file, name: file, widget: file, required: false, hint: "Required for gated guides. This is what gets emailed." }
      - { label: Preview (gated guides), name: preview, widget: markdown, required: false }
      - { label: Body (open guides), name: body, widget: markdown, required: false }

  - name: logos
    label: Client logos
    label_singular: Logo
    folder: src/logos
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Client name, name: title, widget: string }
      - { label: Logo, name: image, widget: image, hint: "SVG or PNG on a transparent background, at least 240px wide" }
      - { label: Website, name: url, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 10, value_type: int }

  - name: settings
    label: Settings
    files:
      - name: contact
        label: Contact details
        file: src/_data/contact.json
        format: json
        fields:
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: WhatsApp number (digits only, with country code), name: whatsapp, widget: string, required: false }
          - { label: WhatsApp number as shown on the site, name: whatsappDisplay, widget: string, required: false, hint: "e.g. 067 077 0633" }
          - { label: Address, name: address, widget: string, required: false }
          - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - { label: Facebook URL, name: facebook, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
      - name: promos
        label: Specials & banners
        file: src/_data/promos.json
        format: json
        fields:
          - label: Promos
            name: items
            widget: list
            summary: "{{fields.id}} · {{fields.style}} · ends {{fields.endDate}}"
            fields:
              - { label: ID (short, unique, no spaces), name: id, widget: string, hint: "e.g. yearend-fee-2026. Change it to show a dismissed promo again." }
              - { label: Switched on, name: active, widget: boolean, default: true }
              - { label: Style, name: style, widget: select, options: [ { label: "Bar under the menu", value: bar }, { label: "Pop-up in the corner", value: popup } ], default: bar }
              - { label: Pop-up heading, name: title, widget: string, required: false }
              - { label: Message, name: message, widget: text }
              - { label: Button or link text, name: linkLabel, widget: string, required: false }
              - { label: Button or link URL, name: linkUrl, widget: string, required: false, hint: "e.g. /events/#plan" }
              - { label: Show on pages, name: pages, widget: list, required: false, hint: "e.g. / or /events/. Leave empty to show on every page." }
              - { label: Last day to show, name: endDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - name: emails
        label: Email copy
        file: src/_data/emails.json
        format: json
        fields:
          - { label: Sign-off, name: signoff, widget: string }
          - { label: Disclaimer line, name: disclaimer, widget: string }
          - label: Guide delivery
            name: guide
            widget: object
            fields: &emailFields
              - { label: Subject, name: subject, widget: string, hint: "Use {{firstName}} and {{guideTitle}}" }
              - { label: Heading, name: heading, widget: string }
              - { label: Paragraphs, name: body, widget: list, field: { label: Paragraph, name: p, widget: text } }
              - { label: Button text, name: button, widget: string }
              - { label: Button link, name: buttonUrl, widget: string, required: false }
          - { label: Guide follow-up (day 5), name: guideFollowup, widget: object, fields: *emailFields }
          - { label: Demo follow-up (day 5), name: demoFollowup, widget: object, fields: *emailFields }
